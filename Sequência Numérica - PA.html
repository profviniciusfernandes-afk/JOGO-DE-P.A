<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <title>Missão Sequências & Progressão Aritmética (PA)</title>

  <!-- Lucide Icons -->

  <!-- React & ReactDOM -->

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #090d16;
      color: #f8fafc;
      overflow-x: hidden;
    }
    
    h1, h2, h3, h4, .font-heading {
      font-family: 'Outfit', sans-serif;
    }

    .glass-card {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-card-hover:hover {
      background: rgba(31, 41, 55, 0.85);
      border-color: rgba(99, 102, 241, 0.4);
      transform: translateY(-2px);
    }

    .glow-indigo {
      box-shadow: 0 0 25px -5px rgba(99, 102, 241, 0.4);
    }

    .glow-emerald {
      box-shadow: 0 0 25px -5px rgba(16, 185, 129, 0.4);
    }

    .glow-amber {
      box-shadow: 0 0 25px -5px rgba(245, 158, 11, 0.4);
    }

    .glow-cyan {
      box-shadow: 0 0 25px -5px rgba(6, 182, 212, 0.4);
    }

    @keyframes pulse-subtle {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    .animate-pulse-subtle {
      animation: pulse-subtle 3s infinite ease-in-out;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #090d16;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

    @media print {
      body {
        background: #ffffff !important;
        color: #000000 !important;
      }
      header, footer, .no-print {
        display: none !important;
      }
      .glass-card {
        background: #ffffff !important;
        border: 1px solid #cbd5e1 !important;
        color: #0f172a !important;
        box-shadow: none !important;
      }

        color: #000000 !important;

</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    function Icon({ name, className = "w-5 h-5" }) {
      const spanRef = useRef(null);

      useEffect(() => {
        if (window.lucide && spanRef.current) {
          spanRef.current.innerHTML = `<i data-lucide="${name}"></i>`;
          window.lucide.createIcons({
            nameAttr: 'data-lucide',
            attrs: { class: className },
            container: spanRef.current
          });
        }
      }, [name, className]);

      return <span ref={spanRef} className="inline-flex items-center justify-center shrink-0" />;
    }

    function playSound(type, enabled = true) {
      if (!enabled) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'correct') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
          osc.start();
          osc.stop(ctx.currentTime + 0.25);
        } else if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, ctx.currentTime);
          gain.gain.setValueAtTime(0.05, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        }
      } catch (e) {
        // Fallback silently if web audio API is restricted
      }
    }

    function VisualSequenceDiagram({ a1 = 3, r = 4, n = 5 }) {
      const terms = useMemo(() => {
        const list = [];
        for (let i = 1; i <= Math.min(n, 7); i++) {
          list.push({ pos: i, val: a1 + (i - 1) * r });
        }
        return list;
      }, [a1, r, n]);

      const targetVal = a1 + (n - 1) * r;
      const totalSum = ((a1 + targetVal) * n) / 2;

      return (
        <div className="flex flex-col items-center bg-slate-900/90 p-5 rounded-2xl border border-slate-800 my-3 shadow-inner w-full">
          {/* Centered sequence cards with difference badges */}
          <div className="w-full overflow-x-auto pb-4 pt-2">
            <div className="flex items-center justify-center min-w-[340px] space-x-2 sm:space-x-3 px-2">
              {terms.map((item, idx) => (
                <React.Fragment key={item.pos}>
                  {idx > 0 && (
                    <div className="flex flex-col items-center justify-center shrink-0">
                      <div className="px-2 py-0.5 rounded-full bg-cyan-950/80 border border-cyan-500/40 text-[11px] font-bold text-cyan-300 shadow">
                        {r >= 0 ? `+${r}` : `${r}`}
                      </div>
                      <Icon name="arrow-right" className="w-4 h-4 text-cyan-400 mt-0.5" />
                    </div>
                  )}
                  <div className="flex flex-col items-center shrink-0">
                    <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">
                      a<sub>{item.pos}</sub>
                    </span>
                    <div className={`w-14 h-16 sm:w-16 sm:h-20 rounded-xl flex flex-col items-center justify-center font-extrabold text-base sm:text-lg border transition-all duration-300 shadow-md ${
                      item.pos === n 
                        ? 'bg-gradient-to-b from-indigo-600 to-indigo-800 border-indigo-400 text-white ring-2 ring-indigo-400/50 scale-105'
                        : 'bg-slate-800/90 border-slate-700 text-slate-100'
                    }`}>
                      <span>{item.val}</span>
                      <span className="text-[9px] font-normal text-slate-300 mt-0.5">
                        {item.pos === 1 ? '1º termo' : `${item.pos}º termo`}
                      </span>
                    </div>
                  </div>
                </React.Fragment>
              ))}

              {n > 7 && (
                <div className="flex items-center space-x-2 shrink-0">
                  <span className="text-slate-500 font-bold text-xl">...</span>
                  <div className="flex flex-col items-center shrink-0">
                    <span className="text-[10px] font-bold uppercase tracking-wider text-indigo-400 mb-1">
                      a<sub>{n}</sub>
                    </span>
                    <div className="w-14 h-16 sm:w-16 sm:h-20 rounded-xl bg-gradient-to-b from-indigo-600 to-indigo-800 border border-indigo-400 text-white font-extrabold text-base sm:text-lg flex flex-col items-center justify-center shadow-lg ring-2 ring-indigo-400/50">
                      <span>{targetVal}</span>
                      <span className="text-[9px] font-normal text-indigo-200 mt-0.5">n-ésimo</span>
                    </div>
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* Step-by-step mathematical deduction alignment */}
          <div className="w-full max-w-xl bg-slate-950/80 p-4 rounded-xl border border-slate-800 text-left text-xs space-y-2 mt-2">
            <div className="flex items-center justify-between border-b border-slate-800 pb-2 text-indigo-300 font-bold">
              <span className="flex items-center space-x-1.5">
                <Icon name="sparkles" className="w-4 h-4 text-cyan-400" />
                <span>Dedução Passo a Passo do Termo Geral:</span>
              </span>
              <span className="text-[11px] bg-indigo-950 px-2.5 py-0.5 rounded-md border border-indigo-800">
                Fórmula: a<sub>n</sub> = a<sub>1</sub> + (n - 1)·r
              </span>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-slate-300 pt-1">
              <div className="bg-slate-900/90 p-2.5 rounded-lg border border-slate-800">
                <p className="font-semibold text-slate-200 mb-1">Padrão dos Saltos de Razão:</p>
                <p>• a<sub>1</sub> = {a1} <span className="text-slate-500">(0 saltos de r)</span></p>
                <p>• a<sub>2</sub> = {a1} + 1·({r}) = {a1 + r}</p>
                <p>• a<sub>3</sub> = {a1} + 2·({r}) = {a1 + 2*r}</p>
                <p className="text-cyan-400 font-medium">• a<sub>{n}</sub> = {a1} + ({n} - 1)·({r})</p>
              </div>

              <div className="bg-slate-900/90 p-2.5 rounded-lg border border-slate-800 flex flex-col justify-between">
                <div>
                  <p className="font-semibold text-slate-200 mb-1">Cálculo do Termo a<sub>{n}</sub>:</p>
                  <p className="text-base font-bold text-emerald-400 font-mono mt-1">
                    a<sub>{n}</sub> = {a1} + ({n - 1}) · {r} = {targetVal}
                  </p>
                </div>

                <div className="pt-2 border-t border-slate-800 mt-2">
                  <p className="text-[11px] text-amber-300 font-medium">
                    Soma dos {n} primeiros termos (S<sub>{n}</sub>):
                  </p>
                  <p className="font-mono text-amber-400 font-bold text-xs">
                    S<sub>{n}</sub> = [({a1} + {targetVal}) · {n}] / 2 = {totalSum}
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

        subtitle: "Cálculo de somatórias finitas e modelos aplicados",
        description: "Aplique a fórmula da soma dos termos da PA Sn = [(a1 + an)·n] / 2 em problemas contextualizados de concursos e ENEM.",

        questions: [
          {
            id: "q3_1",
            text: "(ENEM) A soma dos 10 primeiros termos da Progressão Aritmética (3, 7, 11, 15, ...) é igual a:",
            options: ["180", "210", "240", "270"],
            correctIndex: 1,
            hint: "Encontre primeiro a₁₀ = 3 + 9·4 = 39. Depois use S₁₀ = [(3 + 39)·10] / 2.",
            explanation: "a₁ = 3, r = 4. a₁₀ = 3 + 9(4) = 39. S₁₀ = [(3 + 39)·10] / 2 = (42 · 10) / 2 = 210."
          },
          {
            id: "q3_2",
            text: "(FUVEST) Qual é a soma de todos os números inteiros consecutivos de 1 a 100 (1 + 2 + 3 + ... + 100)?",
            options: ["5.000", "5.050", "5.100", "10.000"],
            correctIndex: 1,
            hint: "O jovem Carl Friedrich Gauss usou a soma da PA: S₁₀₀ = [(1 + 100)·100] / 2.",
            explanation: "S₁₀₀ = [(1 + 100)·100] / 2 = 101 · 50 = 5.050."
          },
          {
            id: "q3_3",
            text: "(UNICAMP) Se somarmos os 50 primeiros números pares positivos (2, 4, 6, ..., 100), qual resultado obteremos?",
            options: ["2.500", "2.550", "2.600", "5.100"],
            correctIndex: 1,
            hint: "a₁ = 2, a₅₀ = 100, n = 50. Aplique a fórmula da soma.",
            explanation: "S₅₀ = [(a₁ + a₅₀)·50] / 2 = [(2 + 100)·50] / 2 = 102 · 25 = 2.550."
          },
          {
            id: "q3_4",
            text: "(ENEM) Um poço foi perfurado por uma empresa. O 1º metro custou R$ 100,00 e cada metro seguinte custou R$ 30,00 a mais que o anterior. Quanto custou no total a perfuração completa de um poço de 10 metros?",
            options: ["R$ 2.100,00", "R$ 2.350,00", "R$ 2.500,00", "R$ 2.700,00"],
            correctIndex: 1,
            hint: "O 10º metro custou a₁₀ = 100 + 9(30) = 370. Calcule a soma total S₁₀.",
            explanation: "a₁ = 100, r = 30. a₁₀ = 100 + 270 = 370. S₁₀ = [(100 + 370)·10] / 2 = 470 · 5 = R$ 2.350,00."
          },
          {
            id: "q3_5",
            text: "(UERJ) A soma dos n primeiros termos de uma PA é expressa por S♮ = 2n² + 3n. Qual é o primeiro termo (a₁) e a razão (r) dessa progressão?",
            options: [
              "a₁ = 5 e r = 4",
              "a₁ = 5 e r = 2",
              "a₁ = 3 e r = 4",
              "a₁ = 2 e r = 3"
            ],
            correctIndex: 0,
            hint: "S₁ = a₁ e S₂ = a₁ + a₂. Teste n = 1 e n = 2 na fórmula fornecida.",
            explanation: "S₁ = a₁ = 2(1)² + 3(1) = 5. S₂ = a₁ + a₂ = 2(2)² + 3(2) = 14 ➔ a₂ = 14 - 5 = 9. Razão r = a₂ - a₁ = 9 - 5 = 4."
          },
          {
            id: "q3_6",
            text: "(UNESP) Quantos termos da PA (1, 4, 7, 10, ...) devem ser somados a partir do primeiro para que a soma total resulte em 117?",
            options: ["7 termos", "8 termos", "9 termos", "10 termos"],
            correctIndex: 2,
            hint: "Substitua a♮ = 1 + (n - 1)3 na fórmula S♮ = [(a₁ + a♮)·n] / 2 = 117.",
            explanation: "a♮ = 3n - 2. S♮ = [(1 + 3n - 2)·n] / 2 = 117 ➔ (3n - 1)n = 234 ➔ 3n² - n - 234 = 0. Resolvendo a equação do 2º grau: n = 9."
          },
          {
            id: "q3_7",
            text: "(FGV) A soma de todos os números múltiplos de 5 compreendidos entre 8 e 98 é igual a:",
            options: ["900", "945", "980", "1.020"],
            correctIndex: 1,
            hint: "Múltiplos no intervalo: a₁ = 10, a♮ = 95, r = 5. Determine n e aplique S♮.",
            explanation: "95 = 10 + (n - 1)5 ➔ 85 = 5(n - 1) ➔ n = 18 termos. S₁₈ = [(10 + 95)·18] / 2 = 105 · 9 = 945."
          },
          {
            id: "q3_8",
            text: "(UFRGS) Uma criança constrói torres de blocos. A 1ª torre tem 2 blocos, a 2ª tem 5, a 3ª tem 8. Quantos blocos serão usados ao todo para construir as primeiras 8 torres?",
            options: ["96 blocos", "100 blocos", "104 blocos", "112 blocos"],
            correctIndex: 1,
            hint: "a₁ = 2, r = 3. Ache a₈ = 2 + 7(3) = 23. Em seguida calcule a soma S₈.",
            explanation: "a₈ = 2 + 21 = 23. S₈ = [(2 + 23)·8] / 2 = 25 · 4 = 100 blocos no total."
          },
          {
            id: "q3_9",
            text: "(ENEM) Um estudante junta moedas em seu cofre diariamente: no 1º dia deposita R$ 1,00, no 2º dia R$ 2,00, no 3º dia R$ 3,00, mantendo esse padrão. Ao final de 30 dias, qual o total acumulado no cofre?",
            options: ["R$ 435,00", "R$ 450,00", "R$ 465,00", "R$ 480,00"],
            correctIndex: 2,
            hint: "a₁ = 1, a₃₀ = 30, n = 30. Calcule a soma S₃₀.",
            explanation: "S₃₀ = [(1 + 30)·30] / 2 = 31 · 15 = R$ 465,00."
          },
          {
            id: "q3_10",
            text: "(VUNESP) Em uma pista de atletismo, as placas de distância estão a cada 40 metros (a₁ = 40, a₂ = 80, a₃ = 120, ...). Qual é a distância acumulada somando a posição de todas as 15 primeiras placas?",
            options: ["4.200 m", "4.500 m", "4.800 m", "5.100 m"],
            correctIndex: 2,
            hint: "a₁₅ = 40 · 15 = 600 metros. Calcule a soma da PA para as 15 posições.",
            explanation: "a₁ = 40, a₁₅ = 600, n = 15. S₁₅ = [(40 + 600)·15] / 2 = (640 · 15) / 2 = 320 · 15 = 4.800 m."
          }
        ]
      }
    ];

    function App() {
      // Student Profile & State
      const [studentName, setStudentName] = useState(() => localStorage.getItem('pa_student_name') || '');
      const [studentClass, setStudentClass] = useState(() => localStorage.getItem('pa_student_class') || '');
      const [isEditingName, setIsEditingName] = useState(!localStorage.getItem('pa_student_name'));
      const [showClearModal, setShowClearModal] = useState(false);
      const [showResetGameModal, setShowResetGameModal] = useState(false);
      const [answersLog, setAnswersLog] = useState(() => {
        return JSON.parse(localStorage.getItem('pa_answers_log')) || [];
      });

      // Player Score & Navigation
      const [xp, setXp] = useState(() => Number(localStorage.getItem('pa_xp')) || 0);
      const [streak, setStreak] = useState(0);
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [activeTab, setActiveTab] = useState('campaign');

      // Campaign Mode State
      const [selectedLevel, setSelectedLevel] = useState(null);
      const [currentQuestionIdx, setCurrentQuestionIdx] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [isAnswered, setIsAnswered] = useState(false);
      const [lives, setLives] = useState(3);
      const [levelScore, setLevelScore] = useState(0);
      const [showHint, setShowHint] = useState(false);
      const [completedLevels, setCompletedLevels] = useState(() => {
        return JSON.parse(localStorage.getItem('pa_completed')) || [];
      });

      // Blitz Mode State
      const [blitzActive, setBlitzActive] = useState(false);
      const [blitzTime, setBlitzTime] = useState(60);
      const [blitzScore, setBlitzScore] = useState(0);
      const [blitzQuestions, setBlitzQuestions] = useState([]);
      const [blitzIdx, setBlitzIdx] = useState(0);

      // Interactive Lab State
      const [labA1, setLabA1] = useState(3);
      const [labR, setLabR] = useState(4);
      const [labN, setLabN] = useState(5);

      useEffect(() => {
        localStorage.setItem('pa_xp', xp.toString());
        localStorage.setItem('pa_completed', JSON.stringify(completedLevels));
        localStorage.setItem('pa_student_name', studentName);
        localStorage.setItem('pa_student_class', studentClass);
        localStorage.setItem('pa_answers_log', JSON.stringify(answersLog));
      }, [xp, completedLevels, studentName, studentClass, answersLog]);

      // Timer effect for Blitz Mode
      useEffect(() => {
        let timer = null;
        if (blitzActive && blitzTime > 0) {
          timer = setInterval(() => setBlitzTime(prev => prev - 1), 1000);
        } else if (blitzTime === 0 && blitzActive) {
          setBlitzActive(false);
          playSound('correct', soundEnabled);
        }
        return () => clearInterval(timer);
      }, [blitzActive, blitzTime, soundEnabled]);

      const startLevel = (level) => {
        if (!studentName.trim()) {
          setIsEditingName(true);
          return;
        }
        setSelectedLevel(level);
        setCurrentQuestionIdx(0);
        setSelectedOption(null);
        setIsAnswered(false);
        setLives(3);
        setLevelScore(0);
        setShowHint(false);
        playSound('click', soundEnabled);
      };

      const handleAnswer = (optionIdx) => {
        if (isAnswered || lives <= 0) return;
        setSelectedOption(optionIdx);
        setIsAnswered(true);

        const currentQ = selectedLevel.questions[currentQuestionIdx];
        const isCorrect = optionIdx === currentQ.correctIndex;

        const newLog = {
          timestamp: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }),
          levelId: selectedLevel.id,
          levelTitle: selectedLevel.title,
          questionId: currentQ.id,
          questionText: currentQ.text,
          userAnswer: currentQ.options[optionIdx],
          correctAnswer: currentQ.options[currentQ.correctIndex],
          isCorrect: isCorrect
        };

        setAnswersLog(prev => {
          const filtered = prev.filter(item => item.questionId !== currentQ.id);
          return [...filtered, newLog];
        });

        if (isCorrect) {
          playSound('correct', soundEnabled);
          const pointsGained = 100 + streak * 20;
          setLevelScore(prev => prev + pointsGained);
          setXp(prev => prev + pointsGained);
          setStreak(prev => prev + 1);

          if (window.confetti) {
            window.confetti({ particleCount: 40, spread: 60, origin: { y: 0.8 } });
          }
        } else {
          playSound('wrong', soundEnabled);
          setStreak(0);
          setLives(prev => Math.max(0, prev - 1));
        }
      };

      const nextQuestion = () => {
        if (currentQuestionIdx + 1 < selectedLevel.questions.length) {
          setCurrentQuestionIdx(prev => prev + 1);
          setSelectedOption(null);
          setIsAnswered(false);
          setShowHint(false);
        } else {
          // Level finished
          if (!completedLevels.includes(selectedLevel.id)) {
            setCompletedLevels(prev => [...prev, selectedLevel.id]);
          }
          if (window.confetti) {
            window.confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
          }
        }
      };

      const startBlitz = () => {
        if (!studentName.trim()) {
          setIsEditingName(true);
          return;
        }
        const allQuestions = GAME_LEVELS.flatMap(l => l.questions);
        setBlitzQuestions(allQuestions.sort(() => Math.random() - 0.5));
        setBlitzIdx(0);
        setBlitzScore(0);
        setBlitzTime(60);
        setBlitzActive(true);
        playSound('click', soundEnabled);
      };

      const handleBlitzAnswer = (optionIdx) => {
        const q = blitzQuestions[blitzIdx];
        if (!q) return;
        if (optionIdx === q.correctIndex) {
          playSound('correct', soundEnabled);
          setBlitzScore(prev => prev + 150);
          setXp(prev => prev + 150);
        } else {
          playSound('wrong', soundEnabled);
        }
        if (blitzIdx + 1 < blitzQuestions.length) {
          setBlitzIdx(prev => prev + 1);
        } else {
          setBlitzQuestions(prev => [...prev].sort(() => Math.random() - 0.5));
          setBlitzIdx(0);
        }
      };

      const handleResetGame = () => {
        setXp(0);
        setStreak(0);
        setCompletedLevels([]);
        setAnswersLog([]);
        setSelectedLevel(null);
        setBlitzActive(false);
        localStorage.removeItem('pa_xp');
        localStorage.removeItem('pa_completed');
        localStorage.removeItem('pa_answers_log');
        setShowResetGameModal(false);
        playSound('click', soundEnabled);
      };

      const clearHistory = () => {
        setAnswersLog([]);
        localStorage.removeItem('pa_answers_log');
        setShowClearModal(false);
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          
          {/* HEADER */}
          <header className="glass-card sticky top-0 z-50 px-4 py-3 border-b border-slate-800/80 no-print">
            <div className="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-3">
              
              <div 
                className="flex items-center space-x-3 cursor-pointer" 
                onClick={() => { setSelectedLevel(null); setActiveTab('campaign'); }}
              >
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 via-indigo-500 to-purple-600 flex items-center justify-center shadow-lg glow-indigo">
                  <Icon name="binary" className="w-6 h-6 text-white" />
                </div>
                <div>
                  <h1 className="text-lg font-bold font-heading bg-clip-text text-transparent bg-gradient-to-r from-white via-cyan-200 to-indigo-300">
                    Missão Sequências & PA
                  </h1>
                  <span className="text-xs text-cyan-400 font-semibold">1º Ano Ensino Médio</span>
                </div>
              </div>

              {/* IDENTIFICAÇÃO DO ALUNO NO HEADER */}

                <Icon name="user-check" className="w-4 h-4 text-cyan-400" />
                <div className="flex flex-col text-left">
                  <span className="text-xs font-bold text-white max-w-[130px] truncate">
                    {studentName || 'Nome do Aluno'}
                  </span>
                  <span className="text-[10px] text-slate-400">
                    {studentClass ? `Série/Turma: ${studentClass}` : 'Série não informada'}
                  </span>
                </div>
                <button 
                  onClick={() => setIsEditingName(true)}
                  className="p-1 hover:bg-slate-800 rounded text-slate-400 hover:text-cyan-300 transition"
                  title="Alterar Nome ou Série"
                >
                  <Icon name="edit-3" className="w-3.5 h-3.5" />
                </button>
              </div>

              {/* STATS & ACTIONS */}
              <div className="flex items-center space-x-2.5">
                <div className="flex items-center space-x-1.5 bg-indigo-950/80 border border-indigo-800/60 px-3 py-1.5 rounded-lg text-indigo-300 font-bold text-sm">
                  <Icon name="zap" className="w-4 h-4 text-amber-400" />
                  <span>{xp} XP</span>
                </div>

                <button 
                  onClick={() => setShowResetGameModal(true)}
                  className="px-2.5 py-1.5 rounded-lg bg-red-900/40 hover:bg-red-800/60 text-red-300 transition border border-red-800/50 flex items-center space-x-1.5"
                  title="Reiniciar a Partida / Resetar Jogo"
                >
                  <Icon name="rotate-ccw" className="w-4 h-4" />
                  <span className="text-xs font-bold hidden sm:inline">Reiniciar Partida</span>
                </button>

                <button 
                  onClick={() => setSoundEnabled(!soundEnabled)}
                  className="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition"
                  title={soundEnabled ? "Desativar Som" : "Ativar Som"}
                >
                  <Icon name={soundEnabled ? "volume-2" : "volume-x"} className="w-5 h-5" />
                </button>
              </div>
            </div>
          </header>

          {/* MODAL / PROMPT INICIAL DE NOME E SÉRIE */}
          {isEditingName && (
            <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4 no-print">
              <div className="glass-card max-w-md w-full p-6 rounded-2xl border border-cyan-500/30 shadow-2xl space-y-4 animate-fadeIn">
                <div className="flex items-center space-x-3 text-cyan-400">
                  <div className="w-10 h-10 rounded-xl bg-cyan-500/20 border border-cyan-500/40 flex items-center justify-center">
                    <Icon name="user-check" className="w-6 h-6" />
                  </div>
                  <div>

                  <div>

                >
                  Entrar na Partida
                </button>
              </div>
            </div>
          )}

          {/* MAIN CONTENT AREA */}
          <main className="max-w-6xl mx-auto px-4 py-6 flex-grow w-full">

            {!selectedLevel && (
              <div>

                  <div className="relative z-10 max-w-3xl">
                    <span className="inline-block px-3 py-1 rounded-full text-xs font-semibold bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 mb-3">

                      Explore a construção visual da fórmula do termo geral <code className="text-cyan-300 font-bold bg-slate-900 px-1.5 py-0.5 rounded">a<sub>n</sub> = a<sub>1</sub> + (n - 1)·r</code> no laboratório virtual, supere as 3 fases com 10 questões reais de vestibulares e exporte seu relatório completo em PDF!

                  >
                    <Icon name="flask-conical" className="w-4 h-4" />

                  </button>

                  <button

                  >
                    <Icon name="clipboard-list" className="w-4 h-4" />

                  </button>

                  <button

                  >
                    <Icon name="timer" className="w-4 h-4" />
                    <span>Desafio Blitz (60s)</span>
                  </button>

                  <button 
                    onClick={() => setActiveTab('guide')}
                    className={`flex items-center space-x-2 px-4 py-2.5 rounded-t-xl font-semibold text-sm transition ${activeTab === 'guide' ? 'bg-purple-600 text-white border-t border-x border-purple-500' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'}`}
                  >
                    <Icon name="book-open" className="w-4 h-4" />
                    <span>Resumo Teórico</span>
                  </button>
                </div>

                {/* ABA 1: MODO CAMPANHA */}
                {activeTab === 'campaign' && (
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                    {GAME_LEVELS.map((level) => {
                      const isCompleted = completedLevels.includes(level.id);
                      return (
                        <div 
                          key={level.id} 
                          className="glass-card glass-card-hover rounded-2xl p-5 flex flex-col justify-between border border-slate-800 relative overflow-hidden transition duration-300"
                        >
                          {isCompleted && (
                            <div className="absolute top-3 right-3 bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 text-xs px-2.5 py-1 rounded-full font-bold flex items-center space-x-1">
                              <Icon name="check-circle" className="w-3.5 h-3.5" />
                              <span>Concluída</span>
                            </div>
                          )}

                          <div>
                            <div className={`w-12 h-12 rounded-xl bg-gradient-to-tr ${level.color} flex items-center justify-center mb-4 shadow-lg`}>
                              <Icon name={level.icon} className="w-6 h-6 text-white" />
                            </div>
                            <span className="text-xs font-bold text-cyan-400 uppercase tracking-wider">
                              Fase {level.id} • 10 Questões • 3 Vidas
                            </span>
                            <h3 className="text-lg font-bold text-white mt-1 mb-1 font-heading">{level.title}</h3>
                            <p className="text-xs font-semibold text-slate-400 mb-3">{level.subtitle}</p>
                            <p className="text-xs text-slate-300 leading-relaxed mb-4">{level.description}</p>
                          </div>

                          <button 
                            onClick={() => startLevel(level)}
                            className="w-full py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm shadow-md transition flex items-center justify-center space-x-2"
                          >
                            <Icon name="play" className="w-4 h-4 text-white" />
                            <span>{isCompleted ? "Refazer Fase" : "Iniciar Fase"}</span>
                          </button>
                        </div>
                      );
                    })}
                  </div>
                )}

                {/* ABA 2: LABORATÓRIO VIRTUAL */}
                {activeTab === 'lab' && (
                  <div className="glass-card rounded-2xl p-6 border border-slate-800 space-y-6">
                    <div className="border-b border-slate-800 pb-4">
                      <div className="flex items-center space-x-2 text-cyan-400 mb-1">
                        <Icon name="flask-conical" className="w-6 h-6" />
                        <h3 className="text-xl font-bold font-heading text-white">Laboratório Virtual: Desvendando a Fórmula de a<sub>n</sub></h3>
                      </div>
                      <p className="text-xs text-slate-300">
                        Altere os parâmetros do primeiro termo (a₁), da razão (r) e da posição desejada (n) para observar como cada salto de razão constrói a fórmula do termo geral.
                      </p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 bg-slate-900/80 p-4 rounded-xl border border-slate-800">
                      <div>
                        <label className="block text-xs font-bold text-slate-300 mb-1">
                          Primeiro Termo (a₁): <strong className="text-cyan-400">{labA1}</strong>
                        </label>
                        <input 
                          type="range" 
                          min="-10" 
                          max="20" 
                          value={labA1} 
                          onChange={(e) => setLabA1(Number(e.target.value))}
                          className="w-full accent-cyan-500 cursor-pointer"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-300 mb-1">
                          Razão Constante (r): <strong className="text-cyan-400">{labR >= 0 ? `+${labR}` : labR}</strong>
                        </label>
                        <input 
                          type="range" 
                          min="-10" 
                          max="15" 
                          value={labR} 
                          onChange={(e) => setLabR(Number(e.target.value))}
                          className="w-full accent-cyan-500 cursor-pointer"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-300 mb-1">
                          Posição do Termo (n): <strong className="text-cyan-400">{labN}º termo</strong>
                        </label>
                        <input 
                          type="range" 
                          min="1" 
                          max="15" 
                          value={labN} 
                          onChange={(e) => setLabN(Number(e.target.value))}
                          className="w-full accent-cyan-500 cursor-pointer"
                        />
                      </div>
                    </div>

                    <VisualSequenceDiagram a1={labA1} r={labR} n={labN} />
                  </div>
                )}

                {/* ABA 3: RELATÓRIO DO ALUNO (PDF / IMPRESSÃO) */}
                {activeTab === 'report' && (
                  <div className="glass-card rounded-2xl p-6 border border-slate-800 space-y-6">
                    <div className="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 pb-4 no-print">
                      <div>
                        <h3 className="text-xl font-bold font-heading text-white flex items-center space-x-2">
                          <Icon name="file-text" className="w-6 h-6 text-emerald-400" />
                          <span>Relatório Oficial de Desempenho</span>
                        </h3>
                        <p className="text-xs text-slate-400">
                          Resumo contendo estritamente Nome, Série e detalhamento de respostas para exportação em PDF.
                        </p>
                      </div>

                      <div className="flex items-center space-x-2">
                        <button 
                          onClick={() => window.print()}
                          className="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs flex items-center space-x-1.5 transition shadow"
                        >
                          <Icon name="printer" className="w-4 h-4" />
                          <span>Exportar em PDF / Imprimir</span>
                        </button>
                        <button 
                          onClick={() => setShowClearModal(true)}
                          className="px-3 py-2 rounded-xl bg-red-900/60 hover:bg-red-800 text-red-300 font-bold text-xs flex items-center space-x-1.5 transition border border-red-800/60"
                        >
                          <Icon name="trash-2" className="w-4 h-4" />
                          <span>Limpar Histórico</span>
                        </button>
                      </div>
                    </div>

                    {/* CABEÇALHO DO RELATÓRIO (MOSTRA APENAS NOME E SÉRIE CONFORME SOLICITADO) */}
                    <div className="bg-slate-900/90 p-5 rounded-2xl border border-slate-700/80 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 print-card">
                      <div>
                        <span className="text-xs text-slate-400 block font-medium">Nome do Aluno:</span>
                        <strong className="text-base text-white font-bold">{studentName || 'Não informado'}</strong>
                      </div>
                      <div>
                        <span className="text-xs text-slate-400 block font-medium">Série / Turma:</span>
                        <strong className="text-base text-white font-bold">{studentClass || 'Não informada'}</strong>
                      </div>
                      <div>
                        <span className="text-xs text-slate-400 block font-medium">Questões Respondidas:</span>
                        <strong className="text-base text-indigo-400 font-bold">{answersLog.length} de 30</strong>
                      </div>
                      <div>
                        <span className="text-xs text-slate-400 block font-medium">Aproveitamento Total:</span>
                        {(() => {
                          const correct = answersLog.filter(a => a.isCorrect).length;
                          const total = answersLog.length;
                          const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
                          return (
                            <strong className={`text-base font-bold ${pct >= 70 ? 'text-emerald-400' : 'text-amber-400'}`}>
                              {correct} / {total} ({pct}%)
                            </strong>
                          );
                        })()}
                      </div>
                    </div>

                    {/* DETALHAMENTO DAS QUESTÕES */}
                    {answersLog.length === 0 ? (
                      <div className="text-center py-12 bg-slate-900/40 rounded-xl border border-slate-800">
                        <Icon name="inbox" className="w-12 h-12 text-slate-600 mx-auto mb-3" />
                        <h4 className="text-base font-bold text-slate-300">Nenhum registro no relatório</h4>
                        <p className="text-xs text-slate-500 mt-1">Inicie o Modo Campanha para responder às questões de vestibulares e registrar suas respostas.</p>
                      </div>
                    ) : (
                      <div className="space-y-3">
                        <h4 className="text-sm font-bold text-slate-300 uppercase tracking-wider mb-2">Detalhamento das Respostas:</h4>
                        {answersLog.map((log, index) => (
                          <div 
                            key={index} 
                            className={`p-4 rounded-xl border text-left text-xs leading-relaxed print-card ${
                              log.isCorrect 
                                ? 'bg-emerald-950/20 border-emerald-800/40' 
                                : 'bg-red-950/20 border-red-800/40'
                            }`}
                          >
                            <div className="flex items-start justify-between gap-2 mb-1.5">
                              <span className="font-bold text-slate-200 text-xs sm:text-sm">
                                {index + 1}. [{log.levelTitle}] {log.questionText}
                              </span>
                              <span className={`px-2 py-0.5 rounded-full font-bold text-[10px] shrink-0 flex items-center space-x-1 ${
                                log.isCorrect ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-red-500/20 text-red-400 border border-red-500/30'
                              }`}>
                                <Icon name={log.isCorrect ? "check-circle" : "x-circle"} className="w-3 h-3" />
                                <span>{log.isCorrect ? "Correto" : "Incorreto"}</span>
                              </span>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-2 pt-2 border-t border-slate-800/80">
                              <div>
                                <span className="text-slate-400 block font-medium">Sua Resposta:</span>
                                <strong className={log.isCorrect ? "text-emerald-400" : "text-red-400"}>
                                  {log.userAnswer}
                                </strong>
                              </div>
                              {!log.isCorrect && (
                                <div>
                                  <span className="text-slate-400 block font-medium">Gabarito Correto:</span>
                                  <strong className="text-emerald-400">
                                    {log.correctAnswer}
                                  </strong>
                                </div>
                              )}
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}

                {/* ABA 4: MODO BLITZ */}
                {activeTab === 'blitz' && (
                  <div className="glass-card rounded-2xl p-6 text-center max-w-xl mx-auto border border-amber-500/30 glow-amber">
                    {!blitzActive ? (
                      <div>
                        <div className="w-16 h-16 rounded-full bg-amber-500/20 border border-amber-500/40 flex items-center justify-center mx-auto mb-4 text-amber-400">
                          <Icon name="zap" className="w-8 h-8" />
                        </div>
                        <h3 className="text-2xl font-bold font-heading text-white mb-2">Desafio Blitz (60 Segundos)</h3>
                        <p className="text-slate-300 text-sm mb-6">
                          Teste a sua agilidade resolvendo o maior número de questões aleatórias de PA antes do cronômetro zerar.
                        </p>
                        <button 
                          onClick={startBlitz}
                          className="py-3 px-8 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-extrabold text-base shadow-lg transition transform hover:scale-105"
                        >
                          Começar Blitz Agora
                        </button>
                      </div>
                    ) : (
                      <div>
                        <div className="flex justify-between items-center mb-6 bg-slate-900/90 p-3.5 rounded-xl border border-slate-700">
                          <div className="flex items-center space-x-2 text-amber-400 font-bold">
                            <Icon name="clock" className="w-5 h-5" />
                            <span className="text-2xl font-mono">{blitzTime}s</span>
                          </div>
                          <div className="text-slate-300 text-sm">
                            Pontuação Blitz: <strong className="text-emerald-400 text-lg">{blitzScore} XP</strong>
                          </div>
                        </div>

                        {blitzQuestions[blitzIdx] && (
                          <div className="text-left">
                            <p className="text-base font-semibold text-white mb-4 leading-relaxed">
                              {blitzQuestions[blitzIdx].text}
                            </p>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
                              {blitzQuestions[blitzIdx].options.map((opt, oIdx) => (
                                <button
                                  key={oIdx}
                                  onClick={() => handleBlitzAnswer(oIdx)}
                                  className="p-3.5 rounded-xl bg-slate-800 hover:bg-indigo-600 text-slate-200 hover:text-white font-medium text-xs text-left transition border border-slate-700"
                                >
                                  {opt}
                                </button>
                              ))}
                            </div>
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                )}

                {/* ABA 5: RESUMO TEÓRICO */}
                {activeTab === 'guide' && (
                  <div className="glass-card rounded-2xl p-6 border border-slate-800 space-y-6">
                    <div className="border-b border-slate-800 pb-4">
                      <h3 className="text-xl font-bold font-heading text-white mb-1">Guia de Fórmulas e Conceitos: PA</h3>
                      <p className="text-xs text-slate-400">Conteúdos fundamentais exigidos no 1º Ano do Ensino Médio e ENEM</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div className="bg-slate-900/90 p-4 rounded-xl border border-slate-800">
                        <h4 className="font-bold text-cyan-400 text-sm mb-2 flex items-center space-x-1.5">
                          <Icon name="list-ordered" className="w-4 h-4" />
                          <span>Definição de PA e Razão (r)</span>
                        </h4>
                        <p className="text-xs text-slate-300 leading-relaxed mb-2">
                          Uma Progressão Aritmética é uma sequência em que a diferença entre qualquer termo e seu antecessor é constante: <code className="bg-slate-800 text-cyan-300 px-1 rounded">r = a<sub>n</sub> - a<sub>n-1</sub></code>.
                        </p>
                        <ul className="text-xs text-slate-400 space-y-1 list-disc list-inside">
                          <li><strong>r &gt; 0:</strong> PA Crescente</li>
                          <li><strong>r = 0:</strong> PA Constante</li>
                          <li><strong>r &lt; 0:</strong> PA Decrescente</li>
                        </ul>
                      </div>

                      <div className="bg-slate-900/90 p-4 rounded-xl border border-slate-800">
                        <h4 className="font-bold text-indigo-400 text-sm mb-2 flex items-center space-x-1.5">
                          <Icon name="binary" className="w-4 h-4" />
                          <span>Fórmula do Termo Geral (a<sub>n</sub>)</span>
                        </h4>
                        <p className="text-xs text-slate-300 leading-relaxed mb-2">
                          Permite calcular qualquer termo sem listar toda a sequência:
                        </p>
                        <div className="bg-slate-950 p-2.5 rounded-lg text-center font-mono font-bold text-indigo-300 text-sm border border-indigo-900">
                          a<sub>n</sub> = a<sub>1</sub> + (n - 1) · r
                        </div>
                      </div>

                      <div className="bg-slate-900/90 p-4 rounded-xl border border-slate-800">
                        <h4 className="font-bold text-purple-400 text-sm mb-2 flex items-center space-x-1.5">
                          <Icon name="sigma" className="w-4 h-4" />
                          <span>Soma dos Termos (S<sub>n</sub>)</span>
                        </h4>
                        <p className="text-xs text-slate-300 leading-relaxed mb-2">
                          Média entre o primeiro e o último termo multiplicada pela quantidade de termos:
                        </p>
                        <div className="bg-slate-950 p-2.5 rounded-lg text-center font-mono font-bold text-purple-300 text-sm border border-purple-900">
                          S<sub>n</sub> = [(a<sub>1</sub> + a<sub>n</sub>) · n] / 2
                        </div>
                      </div>

                      <div className="bg-slate-900/90 p-4 rounded-xl border border-slate-800">
                        <h4 className="font-bold text-amber-400 text-sm mb-2 flex items-center space-x-1.5">
                          <Icon name="sparkles" className="w-4 h-4" />
                          <span>Propriedade Média Aritmética</span>
                        </h4>
                        <p className="text-xs text-slate-300 leading-relaxed">
                          Em 3 termos consecutivos de uma PA <code className="bg-slate-800 px-1 text-amber-300 rounded">(a, b, c)</code>, o termo central b é sempre a média dos vizinhos: <code className="bg-slate-800 text-amber-300 px-1 rounded">b = (a + c) / 2</code>.
                        </p>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* INTERFACE DO MODO CAMPANHA (QUESTÕES) */}
            {selectedLevel && (
              <div className="max-w-3xl mx-auto">
                {/* BARRA SUPERIOR DA QUESTÃO */}
                <div className="flex items-center justify-between mb-4">
                  <button 
                    onClick={() => setSelectedLevel(null)}
                    className="flex items-center space-x-1.5 text-xs text-slate-400 hover:text-white transition"
                  >
                    <Icon name="arrow-left" className="w-4 h-4" />
                    <span>Voltar ao Menu</span>
                  </button>

                  <div className="flex items-center space-x-4">
                    {/* VIDAS (3 VIDAS POR FASE) */}
                    <div className="flex items-center space-x-1">
                      {[...Array(3)].map((_, idx) => (
                        <Icon 
                          key={idx} 
                          name="heart" 
                          className={`w-5 h-5 transition-transform duration-300 ${idx < lives ? 'text-red-500 fill-red-500 scale-100' : 'text-slate-700 scale-90'}`}
                        />
                      ))}
                    </div>

                    <span className="text-xs font-bold text-cyan-400 bg-cyan-950/80 border border-cyan-800/60 px-2.5 py-1 rounded-md">
                      Questão {currentQuestionIdx + 1} de {selectedLevel.questions.length}
                    </span>
                  </div>
                </div>

                {/* BARRA DE PROGRESSO */}
                <div className="w-full bg-slate-800 h-2.5 rounded-full mb-6 overflow-hidden border border-slate-700">
                  <div 
                    className="bg-gradient-to-r from-cyan-500 to-indigo-500 h-full transition-all duration-300"
                    style={{ width: `${((currentQuestionIdx + 1) / selectedLevel.questions.length) * 100}%` }}
                  ></div>
                </div>

                {/* GAME OVER SCREEN AO PERDER AS 3 VIDAS */}
                {lives === 0 ? (
                  <div className="glass-card rounded-2xl p-8 border border-red-500/40 text-center space-y-4 shadow-2xl animate-fadeIn">
                    <div className="w-16 h-16 rounded-full bg-red-500/20 text-red-400 flex items-center justify-center mx-auto border border-red-500/30">
                      <Icon name="frown" className="w-8 h-8" />
                    </div>
                    <h3 className="text-2xl font-bold font-heading text-white">Suas 3 Vidas Acabaram!</h3>
                    <p className="text-slate-300 text-sm max-w-md mx-auto leading-relaxed">
                      Não desanime! A matemática se fortalece com o treino constante. Revise as dicas e tente novamente esta fase.
                    </p>
                    <div className="flex justify-center space-x-3 pt-2">
                      <button 
                        onClick={() => setSelectedLevel(null)}
                        className="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs transition"
                      >
                        Menu Principal
                      </button>
                      <button 
                        onClick={() => startLevel(selectedLevel)}
                        className="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs transition shadow"
                      >
                        Reiniciar Fase
                      </button>
                    </div>
                  </div>
                ) : (
                  (() => {
                    const q = selectedLevel.questions[currentQuestionIdx];
                    if (!q) return null;

                    const letters = ["A", "B", "C", "D"];

                    return (
                      <div className="glass-card rounded-2xl p-6 border border-slate-800 shadow-2xl space-y-6">
                        <div>
                          <span className="text-[11px] font-bold text-cyan-400 uppercase tracking-wider block mb-1">
                            {selectedLevel.title} • Questão {currentQuestionIdx + 1} de 10
                          </span>
                          <h3 className="text-base sm:text-lg font-bold text-white mb-2 leading-relaxed font-heading">
                            {q.text}
                          </h3>
                        </div>

                        {/* ALTERNATIVAS ALINHADAS */}
                        <div className="grid grid-cols-1 gap-3">
                          {q.options.map((opt, idx) => {
                            let baseBg = "bg-slate-900/90 hover:bg-slate-800/90 border-slate-700/80 text-slate-100";
                            let badgeBg = "bg-indigo-500/20 text-indigo-300 border-indigo-500/30";

                            if (isAnswered) {
                              if (idx === q.correctIndex) {
                                baseBg = "bg-emerald-600 border-emerald-400 text-white font-bold ring-2 ring-emerald-400/50 shadow-lg glow-emerald";
                                badgeBg = "bg-emerald-800 text-white border-emerald-300";
                              } else if (idx === selectedOption) {
                                baseBg = "bg-red-600 border-red-400 text-white font-bold opacity-90";
                                badgeBg = "bg-red-800 text-white border-red-300";
                              } else {
                                baseBg = "bg-slate-950/60 border-slate-800/60 text-slate-500 opacity-40";
                                badgeBg = "bg-slate-900 text-slate-600 border-slate-800";
                              }
                            }

                            return (
                              <button
                                key={idx}
                                onClick={() => handleAnswer(idx)}
                                disabled={isAnswered}
                                className={`p-4 rounded-xl border text-left text-sm font-medium transition duration-200 flex items-center justify-between space-x-3 ${baseBg}`}
                              >
                                <div className="flex items-center space-x-3">
                                  <span className={`w-7 h-7 rounded-lg border text-xs font-bold flex items-center justify-center shrink-0 ${badgeBg}`}>
                                    {letters[idx]}
                                  </span>
                                  <span>{opt}</span>
                                </div>

                                {isAnswered && idx === q.correctIndex && (
                                  <Icon name="check-circle" className="w-5 h-5 text-white shrink-0" />
                                )}
                                {isAnswered && idx === selectedOption && idx !== q.correctIndex && (
                                  <Icon name="x-circle" className="w-5 h-5 text-white shrink-0" />
                                )}
                              </button>
                            );
                          })}
                        </div>

                        {/* DICA */}
                        {!isAnswered && (
                          <div className="flex justify-between items-center pt-2">
                            <button
                              onClick={() => setShowHint(!showHint)}
                              className="text-xs text-amber-400 hover:text-amber-300 flex items-center space-x-1 transition"
                            >
                              <Icon name="lightbulb" className="w-4 h-4" />
                              <span>{showHint ? "Ocultar Dica" : "Precisa de uma dica?"}</span>
                            </button>
                          </div>
                        )}

                        {showHint && !isAnswered && (
                          <div className="bg-amber-950/40 border border-amber-800/50 p-3.5 rounded-xl text-amber-300 text-xs leading-relaxed">
                            💡 <strong>Dica do Professor:</strong> {q.hint}
                          </div>
                        )}

                        {/* RESOLUÇÃO COMENTADA AO RESPONDER */}
                        {isAnswered && (
                          <div className={`p-4 rounded-xl border text-xs leading-relaxed space-y-2 animate-fadeIn ${
                            selectedOption === q.correctIndex 
                              ? 'bg-emerald-950/40 border-emerald-800/60 text-emerald-200' 
                              : 'bg-slate-900 border-slate-800 text-slate-300'
                          }`}>
                            <div className="font-bold text-sm flex items-center space-x-1.5">
                              <Icon name={selectedOption === q.correctIndex ? "sparkles" : "info"} className="w-4 h-4" />
                              <span>{selectedOption === q.correctIndex ? "Excelente! Resposta Correta!" : "Resolução Detalhada:"}</span>
                            </div>
                            <p className="text-slate-300 leading-relaxed">{q.explanation}</p>

                            <button
                              onClick={() => {
                                if (currentQuestionIdx + 1 < selectedLevel.questions.length) {
                                  nextQuestion();
                                } else {
                                  if (!completedLevels.includes(selectedLevel.id)) {
                                    setCompletedLevels(prev => [...prev, selectedLevel.id]);
                                  }
                                  if (window.confetti) {
                                    window.confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
                                  }
                                  setSelectedLevel(null);
                                  setActiveTab('report');
                                }
                              }}
                              className="w-full mt-3 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm shadow-lg transition flex items-center justify-center space-x-2"
                            >
                              <span>
                                {currentQuestionIdx + 1 < selectedLevel.questions.length 
                                  ? "Avançar para Próxima Questão" 
                                  : "Concluir Fase e Ver Relatório em PDF"}
                              </span>
                              <Icon name="arrow-right" className="w-4 h-4" />
                            </button>
                          </div>
                        )}
                      </div>
                    );
                  })()
                )}
              </div>
            )}
          </main>

          {/* MODAL DE CONFIRMAÇÃO PARA LIMPAR HISTÓRICO DO RELATÓRIO */}
          {showClearModal && (
            <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4 no-print">
              <div className="glass-card max-w-sm w-full p-6 rounded-2xl border border-red-500/30 shadow-2xl text-center space-y-4">
                <div className="w-12 h-12 rounded-full bg-red-500/20 text-red-400 flex items-center justify-center mx-auto">
                  <Icon name="trash-2" className="w-6 h-6" />
                </div>
                <h3 className="text-lg font-bold text-white">Limpar Histórico do Relatório?</h3>
                <p className="text-xs text-slate-300">
                  Isso apagar os registros de respostas atuais mantendo seu XP acumulado para permitir uma nova rodada.
                </p>
                <div className="flex space-x-3 pt-2">
                  <button 
                    onClick={() => setShowClearModal(false)}
                    className="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs transition"
                  >
                    Cancelar
                  </button>
                  <button 
                    onClick={clearHistory}
                    className="flex-1 py-2.5 rounded-xl bg-red-600 hover:bg-red-500 text-white font-bold text-xs transition shadow"
                  >
                    Confirmar Limpeza
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL DE REINICIAR A PARTIDA (RESET TOTAL DO JOGO) */}
          {showResetGameModal && (
            <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4 no-print">
              <div className="glass-card max-w-sm w-full p-6 rounded-2xl border border-red-500/40 shadow-2xl text-center space-y-4 animate-fadeIn">
                <div className="w-12 h-12 rounded-full bg-red-500/20 text-red-400 flex items-center justify-center mx-auto border border-red-500/30">
                  <Icon name="rotate-ccw" className="w-6 h-6" />
                </div>
                <h3 className="text-lg font-bold font-heading text-white">Reiniciar a Partida do Zero?</h3>
                <p className="text-xs text-slate-300 leading-relaxed">
                  Atenção: essa ação irá resetar completamente seu <strong>XP ({xp} XP)</strong>, o progresso das <strong>fases da campanha</strong> e todo o seu <strong>relatório de respostas</strong>.
                </p>
                <div className="flex space-x-3 pt-2">
                  <button 
                    onClick={() => setShowResetGameModal(false)}
                    className="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs transition"
                  >
                    Cancelar
                  </button>
                  <button 
                    onClick={handleResetGame}
                    className="flex-1 py-2.5 rounded-xl bg-red-600 hover:bg-red-500 text-white font-bold text-xs transition shadow-lg"
                  >
                    Reiniciar Partida
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="border-t border-slate-800/80 bg-slate-950/80 py-4 px-4 text-center text-xs text-slate-500 no-print">
            <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
              <span>Missão Sequências & Progressão Aritmética (PA) • Ensino Médio</span>
              <span>Laboratório Virtual & Questões do ENEM / Vestibulares</span>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
